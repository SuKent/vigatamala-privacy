<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>載入中...</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">

  <style>
    body {
      box-sizing: border-box;
      min-width: 200px;
      max-width: 900px;
      margin: 0 auto;
      padding: 45px 20px;
      background-color: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0d1117;
      }
    }

    #loading {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: #6e7781;
      text-align: center;
      padding: 60px 0;
      font-size: 16px;
    }
  </style>
</head>
<body class="markdown-body">
  <div id="content">
    <div id="loading">載入內容中，請稍候...</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <script>
    // 解析網址路徑並對應到 .md 檔案路徑
    function getMarkdownFilePath() {
      let path = window.location.pathname;

      // 如果是根目錄，預設載入 index.md
      if (path === '/' || path === '') {
        return '/index.md';
      }

      // 如果網址結尾沒有 .md，自動補上
      if (!path.endsWith('.md')) {
        path = path + '.md';
      }

      return path;
    }

    async function fetchAndRenderMarkdown() {
      const contentDiv = document.getElementById('content');
      const mdPath = getMarkdownFilePath();

      try {
        const response = await fetch(`${mdPath}?t=${new Date().getTime()}`);
        
        if (!response.ok) {
          throw new Error(`找不到檔案或 HTTP 錯誤 (${response.status})`);
        }

        const markdownText = await response.text();

        marked.setOptions({
          gfm: true,
          breaks: true,
          highlight: function(code, lang) {
            const language = hljs.getLanguage(lang) ? lang : 'plaintext';
            return hljs.highlight(code, { language }).value;
          }
        });

        contentDiv.innerHTML = marked.parse(markdownText);

        const firstHeading = contentDiv.querySelector('h1');
        document.title = firstHeading ? firstHeading.innerText : "文件瀏覽";

      } catch (error) {
        contentDiv.innerHTML = `
          <div style="color: #cf222e; padding: 20px; border: 1px solid #ff8182; border-radius: 6px; background-color: #ffebe9;">
            <h3 style="margin-top:0;">404 - 找不到頁面</h3>
            <p>無法讀取目標檔案：<code>${mdPath}</code></p>
            <p>請確認 GitHub 儲存庫的對應路徑下是否存在該 Markdown 檔案。</p>
          </div>
        `;
      }
    }

    fetchAndRenderMarkdown();
  </script>
</body>
</html>
